# vhost nginx — fp.kelaswfa.my.id  (bagian paket approval Level 2 "gamisjumbo-v1")
#
# Poin penting (PRD D17): `location /api/` mengembalikan 404 untuk publik supaya
# API agent tidak bisa dijangkau dari internet, dan header `Authorization` tidak
# pernah masuk access log. Agent memanggil http://127.0.0.1:8099 langsung.
#
# JANGAN dipasang sebelum paket Level 2 disetujui. Pola di bawah mengikuti gaya
# vhost WordOps yang sudah ada di box ini (server block per-site, log terpisah).

server {
    listen 80;
    listen [::]:80;
    server_name fp.kelaswfa.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fp.kelaswfa.my.id;

    # Sertifikat dikelola WordOps/acme.sh saat membuat site.
    ssl_certificate     /etc/letsencrypt/live/fp.kelaswfa.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fp.kelaswfa.my.id/privkey.pem;
    include /etc/nginx/conf.d/ssl.conf;

    access_log /var/log/nginx/fp.kelaswfa.my.id.access.log;
    error_log  /var/log/nginx/fp.kelaswfa.my.id.error.log;

    root /opt/gamisjumbo/app/static;
    client_max_body_size 20m;
    autoindex off;
    server_tokens off;

    # ---- API agent: TERTUTUP dari publik (D17) ----
    location /api/ {
        return 404;
    }

    # ---- Rate limit form login ----
    location = /login {
        limit_req zone=gj_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:8099;
        include /etc/nginx/conf.d/proxy-gamisjumbo.conf;
    }

    # ---- Uploads: dilayani langsung dari disk, jalur di luar webroot ----
    location /uploads/ {
        alias /opt/gamisjumbo/var/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "inline" always;
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; image/gif gif; }
        default_type application/octet-stream;
    }

    location /static/ {
        alias /opt/gamisjumbo/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8099;
        include /etc/nginx/conf.d/proxy-gamisjumbo.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8099/healthz;
        access_log off;
    }
}

# --- zona rate limit (taruh di /etc/nginx/conf.d/, sekali saja) --------------
# limit_req_zone $binary_remote_addr zone=gj_login:10m rate=10r/m;
#
# --- proxy-gamisjumbo.conf ---------------------------------------------------
# proxy_set_header Host              $host;
# proxy_set_header X-Real-IP         $remote_addr;
# proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_http_version 1.1;
# proxy_set_header Upgrade           $http_upgrade;
# proxy_set_header Connection        "upgrade";
# proxy_read_timeout 60s;
